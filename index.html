<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basketball Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; color: #fff; user-select: none; }
  canvas { display: block; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  #stats { top: 14px; left: 16px; font-size: 15px; line-height: 1.5; }
  #stats b { font-size: 26px; }
  #msg { top: 28%; left: 0; right: 0; text-align: center; font-size: 46px; font-weight: 800; letter-spacing: 1px; opacity: 0; transition: opacity .2s; }
  #logstate { bottom: 12px; right: 16px; font-size: 12px; opacity: .6; }
  #help { bottom: 12px; left: 16px; font-size: 12px; opacity: .6; line-height: 1.5; }
  #cross { left: 50%; top: 50%; width: 0; height: 0; }
  #cross .dot { position: absolute; width: 4px; height: 4px; left: -2px; top: -2px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10,12,18,.78); cursor: pointer; }
  #start .card { max-width: 500px; padding: 28px 32px; background: rgba(20,24,34,.95); border: 1px solid #333a4a; border-radius: 12px; line-height: 1.6; }
  #start h1 { margin: 0 0 8px; font-size: 30px; }
  #start .go { margin-top: 16px; font-size: 18px; font-weight: 700; color: #ffd34d; }
  kbd { background: #2c3344; border: 1px solid #485068; border-radius: 4px; padding: 0 5px; font-size: 13px; }
</style>
</head>
<body>
<div id="stats" class="hud"></div>
<div id="msg" class="hud"></div>
<div id="cross" class="hud"><i class="dot"></i></div>
<div id="logstate" class="hud"></div>
<div id="help" class="hud"><kbd>WASD</kbd> move · <kbd>Space</kbd> jump · <kbd>Click</kbd> shoot · <kbd>RMB</kbd> zoom</div>
<div id="start">
  <div class="card">
    <h1>Basketball Game</h1>
    <div>Aim at the hoop and click. Aim at the glass for a bank shot.</div>
    <div class="go">Click to play</div>
  </div>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module" src="game.js"></script>
</body>
</html>
